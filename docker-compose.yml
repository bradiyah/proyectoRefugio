services:
  mariadb:
    image: mariadb:latest
    container_name: db_refugio
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: refugio_db
      MYSQL_USER: user_refugio
      MYSQL_PASSWORD: password_refugio
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: